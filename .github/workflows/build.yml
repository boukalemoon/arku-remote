name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      draft:
        description: 'Draft release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_glob: 'dist_electron/*.exe'
            name: Windows
          - os: macos-latest
            platform: mac
            artifact_glob: 'dist_electron/*.dmg'
            name: macOS
          # ubuntu-22.04: electron-builder 24.x'in AppImage/app-builder-bin araçları
          # Ubuntu 24.04'te (ubuntu-latest) libfuse2/glibc uyumsuzluğu nedeniyle
          # erken hata veriyor. 22.04 stabil çalışıyor.
          - os: ubuntu-22.04
            platform: linux
            artifact_glob: 'dist_electron/*.AppImage'
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Linux: electron-builder için gerekli sistem paketleri.
      # libfuse2 -> AppImage paketleyici (appimagetool) çalışması için şart.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libnss3-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libcups2-dev \
            libdrm-dev \
            libxkbcommon-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxrandr-dev \
            libgbm-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libasound2-dev

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # Surum tek kaynaktan (package.json + CHANGELOG.md) turer.
      # Web sitesi ya da CHANGELOG geride kaldiysa BURADA patlar —
      # yayindan sonra fark etmektense build'i durdurmak iyidir.
      - name: Version consistency
        run: npm run release:check

      # VITE_ değişkenleri: secret tanımlıysa kullanılır, değilse koddaki public
      # fallback devreye girer (anon key zaten client'a gömülü, RLS ile korunur).
      #
      # TURN: üretimde kimlik bilgisi turn-credentials edge fonksiyonundan
      # SÜRELİ olarak alınır — build'e gömülmez. VITE_TURN_* yalnızca kendi
      # TURN'ünü statik kimlikle işleten kurulumlar için yedek yoldur;
      # tanımlı değilse istemci edge fonksiyonunu kullanır (TURN_SETUP.md).
      - name: Build React app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_QRTIM_URL: ${{ secrets.VITE_QRTIM_URL }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}

      - name: Build Electron — ${{ matrix.name }}
        run: npm run desktop:build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_QRTIM_URL: ${{ secrets.VITE_QRTIM_URL }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          # macOS: kod imzalama olmadan Gatekeeper uyarısı görünür.
          # Sertifika eklemek için CSC_LINK ve CSC_KEY_PASSWORD secret'larını tanımlayın.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist_electron/*.exe
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.snap
          if-no-files-found: warn
          retention-days: 7

  # Tüm platformlar build tamamlandıktan sonra GitHub Release oluştur
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Release aciklamasi CHANGELOG.md'den gelir — surum notlarinin
      # tek kaynagi orasidir, workflow icinde ikinci bir kopya tutulmaz.
      - name: Build release notes
        run: |
          {
            echo "## Arku Remote ${GITHUB_REF_NAME}"
            echo
            node scripts/release.mjs notes
            echo
            echo '### Indirme'
            echo '| Platform | Dosya |'
            echo '|----------|-------|'
            echo '| Windows | `Arku-Remote-Setup.exe` (kurulum) veya `Arku-Remote.exe` (portable) |'
            echo '| macOS | `Arku-Remote.dmg` |'
            echo '| Linux | `Arku-Remote.AppImage` veya `.deb` |'
            echo
            echo '> macOS: uygulama kod imzali degildir. Ilk acilista **sag tik -> Ac** yapin.'
            echo '>'
            echo '> Linux: `chmod +x Arku-Remote.AppImage` ile calistirilabilir yapin.'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event.inputs.draft == 'true' }}
          generate_release_notes: true
          files: release-artifacts/*
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
