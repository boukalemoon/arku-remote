# =============================================================================
# Arku Remote — coturn ÜRETİM yapılandırması
#
# Bu dosya `use-auth-secret` (TURN REST API) modunu kullanır: kullanıcı adı ve
# parola coturn'de TANIMLI DEĞİLDİR. İstemci, `turn-credentials` edge
# fonksiyonundan birkaç saat geçerli bir kimlik bilgisi alır; coturn aynı
# paylaşılan sırla o kimliği yeniden üretip doğrular.
#
# BÖYLECE: statik TURN parolası hiçbir zaman istemci binary'sine girmez.
#
# KURULUM ÖNCESİ DEĞİŞTİRİLECEK 4 SATIR (aşağıda ### ile işaretli):
#   1. external-ip     -> sunucunun genel (public) IP adresi
#   2. realm / server-name -> kendi alan adınız
#   3. static-auth-secret  -> uzun rastgele sır (openssl rand -hex 32)
#   4. cert / pkey         -> Let's Encrypt sertifika yolları
#
# Sır, Supabase'deki TURN_STATIC_AUTH_SECRET ile BİREBİR AYNI olmalıdır.
# =============================================================================

# ── Dinleme ──────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

### Sunucunun genel IP'si. NAT arkasındaysa "GENEL_IP/OZEL_IP" biçimini kullanın.
### Örnek tek IP'li VPS:  external-ip=203.0.113.10
external-ip=DEGISTIRIN_GENEL_IP

### Kendi alan adınız (sertifikayla eşleşmeli)
realm=arku.com.tr
server-name=turn.arku.com.tr

# ── Kimlik doğrulama: paylaşılan sır (TURN REST API) ─────────────────────────
# Bu iki satır, kullanıcı adı/parola tabanlı (`user=`) yapılandırmanın yerine
# geçer. `user=` satırı EKLEMEYİN — eklerseniz kalıcı bir kimlik açmış olursunuz.
use-auth-secret

### openssl rand -hex 32   çıktısını buraya ve Supabase secret'ına yazın
static-auth-secret=DEGISTIRIN_PAYLASILAN_SIR

# ── TLS (turns:) ─────────────────────────────────────────────────────────────
# 443/5349 üzerinden TLS, TURN'ü engelleyen kurumsal güvenlik duvarlarını
# aşmanın en güvenilir yoludur. Sertifika yoksa bu üç satırı yorumlayın;
# turns: adresini de TURN_URLS'ten çıkarın.
### certbot certonly --standalone -d turn.arku.com.tr ile alınır
cert=/etc/letsencrypt/live/turn.arku.com.tr/fullchain.pem
pkey=/etc/letsencrypt/live/turn.arku.com.tr/privkey.pem
no-tlsv1
no-tlsv1_1

# ── Relay port aralığı ───────────────────────────────────────────────────────
# Güvenlik duvarında bu UDP aralığı açık olmalı. Aralık, eşzamanlı oturum
# sayısını sınırlar (oturum başına ~2 port); 49160-49300 ≈ 70 eşzamanlı relay.
min-port=49160
max-port=49300

# ── Kötüye kullanım koruması ─────────────────────────────────────────────────
fingerprint
# Relay'in iç ağa/kendine yönlendirilmesini engelle (TURN'ün proxy olarak
# kullanılıp özel ağınıza sızmasını önler — bu satırlar ihmal edilmemeli).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# IPv6 karsiliklari. Sunucuda IPv6 etkinse bunlar OLMADAN relay, ::1 /
# fc00::/7 / fe80::/10 uzerinden ic aga yonlendirilebilir — yukaridaki IPv4
# satirlarinin engelledigi seyin aynisi, yalnizca diger adres ailesinde.
denied-peer-ip=::1
denied-peer-ip=::
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Relay'in kendi dinleme adresine geri baglanmasini engelle.
no-loopback-peers
# Nonce omru: sinirsiz gecerli bir nonce, yakalanan bir kimligin sureli
# olmasinin anlamini zayiflatir.
stale-nonce=600

# Kota: tek bir kullanıcının tüm bant genişliğini tüketmesini engeller.
# total-quota = eşzamanlı toplam ayırma, user-quota = kullanıcı başına.
total-quota=200
user-quota=6
# Oturum başına bant genişliği tavanı (bayt/sn). 0 = sınırsız.
# 2 Mbps ≈ 250000; uzak masaüstü için makul bir üst sınır.
max-bps=400000

# CLI yönetim arayüzünü kapat (varsayılan parolası zayıftır).
no-cli

# ── Günlükleme ───────────────────────────────────────────────────────────────
# Docker'da stdout'a yaz (docker logs ile okunur).
log-file=stdout
simple-log
# `verbose` üretimde çok gürültülü ve IP kaydı tutar (KVKK) — kapalı.
